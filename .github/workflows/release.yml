# release-please: conventional commits on main -> release PR -> tag + GitHub Release.
# The macOS package is built in this SAME workflow: a tag created with
# GITHUB_TOKEN cannot trigger a separate tag-triggered workflow (the Actions
# recursion guard). workflow_dispatch builds the package without releasing it,
# as a workflow artifact, to check the build before cutting a release.
#
# Releases are created as DRAFTS (release-please-config "draft": true +
# "force-tag-creation": true) and published only after the package is attached,
# so `releases/latest` never points at an asset-less release while the build
# runs — or forever after one that fails.
#
# Recovering from a squatted tag. The release tag check (scripts/check-release-tag.sh, called below) refuses a tag for the next version that
# does not point at the newest main-line commit that moved .release-please-manifest.json to that version
# (someone created vX.Y.Z early, on another commit), and the immutable-tags ruleset has no bypass, so the
# release stays blocked until the tag is gone. Only the repository owner can do this, in this order:
#   1. Settings > Rules > Rulesets: set the tag ruleset to Disabled (do not delete it).
#   2. git push origin :refs/tags/vX.Y.Z   (and delete the draft release for it, if release-please made one)
#   3. Set the ruleset back to Active.
#   4. Re-run the failed workflow run on main; if no tag appears, create it on the release commit by hand.
# Nothing in the repo changes the rulesets: that stays an owner action.

name: Release

on:
  push:
    branches: [main]
  # A PR that touches the engines or the packaging builds the package too, so a
  # broken release build shows up before the release PR does. No paths: filter —
  # the hand list kept missing inputs (scripts/fetch-models.sh, launchd/**,
  # cmd/**, internal/**, go.mod, LICENSE, NOTICE, README.md).
  pull_request:
  workflow_dispatch: {}

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Default: least privilege. Grant only what each job needs.
permissions: {}

jobs:
  release-please:
    name: Release PR / tag
    if: github.event_name == 'push'
    runs-on: ubuntu-24.04-arm
    permissions:
      contents: write
      pull-requests: write
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      - name: Run release-please
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        id: release
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  # One package per architecture, each built natively on a GitHub macOS runner
  # (free for public repos): x86_64 on the Intel image, arm64 on macos-26
  # (Apple Silicon, macOS 26 SDK). The runners do have a Metal device — the
  # check step loads every shipped metallib through MTLDevice — but they do
  # not run the engines end to end; get.sh on real Macs stays the last mile.
  macos-package:
    name: Build the macOS ${{ matrix.arch }} package
    needs: release-please
    if: "!cancelled() && (github.event_name != 'push' || needs.release-please.outputs.release_created == 'true')"
    strategy:
      fail-fast: false
      matrix:
        include:
          # diar_xcode: engine/diar needs Swift 6.2 (Xcode 26); the default Xcode stays the compiler of every other
          # engine and only ox-diar's build switches (engine/diar/build.sh). Package.resolved carries an originHash
          # SwiftPM computes, and one toolchain keeps it from moving (build.sh fails if it does). x86_64 builds no
          # ox-diar (the Intel smoke failed, plan Task 20a), so it names none.
          - arch: x86_64
            runner: macos-15-intel
          # macos-26: the macOS 26 SDK is what builds ggml-tensor.metallib,
          # the Metal4 kernel library M5/A19 devices use; macos-15's SDK 15
          # would silently ship a package that disables the tensor API there.
          - arch: arm64
            runner: macos-26
            diar_xcode: /Applications/Xcode_26.3.app/Contents/Developer
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 120
    # read only: this job runs the build scripts, including a PR's own
    permissions:
      contents: read
    env:
      VERSION: ${{ needs.release-please.outputs.tag_name || format('dev-{0}', github.sha) }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false

      # Build the tag's commit, which must be on the history of the commit this
      # run was started for (main, which the environment admitted). Usually the
      # two are the same; a release cut in a later push's run tags the earlier
      # release merge, and a tag pointing anywhere off main is refused.
      - name: Check out the release tag
        if: needs.release-please.outputs.tag_name != ''
        env:
          TAG: ${{ needs.release-please.outputs.tag_name }}
        run: |
          set -euo pipefail
          git fetch --no-tags origin "+refs/tags/$TAG:refs/tags/$TAG"
          # on the main line of this run's commit and the release commit itself (says why when not)
          commit=$(scripts/check-release-tag.sh "$TAG" "$GITHUB_SHA")
          git checkout --detach "$commit"

      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          # The newest 1.26.x, not the exact `go 1.26.0` floor in go.mod: setup-go v5.6.0 reads only the `go` line
          # (it ignores a `toolchain` line), and a release binary must carry the latest stdlib security patches.
          go-version: '1.26'
          check-latest: true

      # The installer's own tests need macOS (plutil); they are quick, so they
      # run before the long engine build.
      - name: Installer tests
        timeout-minutes: 5
        run: |
          bash scripts/test-lib-install.sh
          bash scripts/test-fetch-models.sh
          bash scripts/test-download-stall.sh

      - name: Build tools
        run: command -v cmake >/dev/null || brew install cmake

      # The engines ship a precompiled Metal library, so the build needs the
      # Metal toolchain. Xcode 26 splits it into a downloadable component —
      # `xcrun -f metal` finds a stub even when it is missing, so the probe
      # compiles and links a trivial kernel the same way the build does. The
      # component download flakes, so it retries with a backoff, and the step
      # is bounded so a wedged download cannot eat the job timeout.
      - name: Metal toolchain
        timeout-minutes: 20
        run: |
          set -euo pipefail
          probe() {
            d=$(mktemp -d)
            printf 'kernel void p() {}\n' > "$d/p.metal"
            xcrun -sdk macosx metal -c "$d/p.metal" -o "$d/p.air" &&
              xcrun -sdk macosx metallib "$d/p.air" -o "$d/p.metallib"
          }
          if probe >/dev/null 2>&1; then
            echo "Metal toolchain present"
          else
            echo "Metal toolchain missing; downloading the component"
            for i in 1 2 3; do
              if xcodebuild -downloadComponent MetalToolchain; then
                break
              fi
              if [ "$i" = 3 ]; then
                echo "xcodebuild -downloadComponent MetalToolchain failed 3 times" >&2
                exit 1
              fi
              echo "MetalToolchain download attempt $i failed; retrying in $((i * 30)) s" >&2
              sleep $((i * 30))
            done
            probe >/dev/null
          fi
          xcrun -sdk macosx metal --version | head -1
          echo "SDK $(xcrun -sdk macosx --show-sdk-version)"

      - name: Package
        env:
          OX_SAY_DIAR_DEVELOPER_DIR: ${{ matrix.diar_xcode }}
        run: scripts/package-release.sh "$VERSION"

      # ox-diar's Core ML models (22 MB): fetch-models.sh checks every file against its pinned SHA-256 whatever the
      # cache held, so the cache only saves the download. Keyed by the hash of the script that pins them.
      - name: Cache the diarization models
        if: matrix.arch == 'arm64'
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/diar-models
          key: diar-models-${{ hashFiles('scripts/fetch-models.sh') }}

      - name: Diarization models
        if: matrix.arch == 'arm64'
        run: bash scripts/fetch-models.sh --diar-only "$RUNNER_TEMP/diar-models"

      - name: Check the package
        env:
          ARCH: ${{ matrix.arch }}
        run: |
          set -euo pipefail
          mkdir -p check
          tar -xzf "dist/ox-say-macos-$ARCH.tar.gz" -C check
          cd check/ox-say
          test "$(cat VERSION)" = "$VERSION"
          # VoxCPM2's server is optional for the installer, so a build that
          # silently dropped it would still install: pin it to the architecture
          # here. arm64 carries it, x86_64 must not.
          bins=(bin/ox-say engine/tts-server engine/ox-stt engine/ox-align engine/ox-llm)
          if [ "$ARCH" = arm64 ]; then
            test -x engine/audiocpp_server
            test -x engine/ox-diar
            bins+=(engine/audiocpp_server engine/ox-diar)
            "$GITHUB_WORKSPACE/scripts/check-arm64-baseline.sh" engine/audiocpp_server
          else
            test ! -e engine/audiocpp_server
            test ! -e engine/ox-diar
          fi
          for bin in "${bins[@]}"; do
            test "$(lipo -archs "$bin")" = "$ARCH"
            # captured first: an otool error must fail the step, not read as "no @rpath"
            libs=$(otool -L "$bin")
            case $libs in
              *@rpath*) echo "$bin links @rpath libraries" >&2; exit 1 ;;
            esac
          done
          # The precompiled Metal libraries: every engine's <bin>.metallib
          # must be there and structurally sound — a missing or corrupt one is
          # a first-run compile for users. arm64 adds the Metal4 tensor
          # libraries built by the macOS 26 SDK.
          metallibs=(engine/tts-server.metallib engine/ox-stt.metallib engine/ox-align.metallib engine/ox-llm.metallib)
          if [ "$ARCH" = arm64 ]; then
            metallibs+=(engine/audiocpp_server.metallib engine/tts-server-tensor.metallib engine/ox-stt-tensor.metallib engine/ox-align-tensor.metallib engine/ox-llm-tensor.metallib)
          fi
          # Structural checks, runnable without a Metal device: the container
          # must be a real MetalLib with a function list, and an ordinary
          # library's AIR target must stay at or below the 14.0 floor of the
          # precompiled libraries — one that targets the build SDK would not
          # load for users on older systems (engines on <14 skip the library
          # and run the embedded sources, so the app's floor stays 13.3). The
          # library must also carry the bf16 kernels the runtime source
          # compile defines on bfloat-capable devices: without them a bf16 op
          # aborts on a missing function. The -tensor libraries intentionally
          # target macOS 26 (Metal4 devices only) and are exempt.
          for lib in "${metallibs[@]}"; do
            test -s "$lib" || { echo "$lib missing from the package" >&2; exit 1; }
            xcrun -sdk macosx air-readobj --file-headers "$lib" > air-headers.txt
            grep -q 'MagicWord: MTLB' air-headers.txt || { echo "$lib is not a MetalLib container" >&2; exit 1; }
            xcrun -sdk macosx air-readobj --symbols "$lib" > air-symbols.txt
            n=$(grep -c 'Type: Function' air-symbols.txt || true)
            if [ "$n" -eq 0 ]; then
              echo "$lib carries no functions" >&2
              exit 1
            fi
            case $lib in
              *-tensor.metallib)
                echo "$lib: $n functions (tensor library, macOS 26 target by design)"
                ;;
              *)
                major=$(awk '/PlatformMajor:/{print $2; exit}' air-headers.txt)
                minor=$(awk '/PlatformMinor:/{print $2; exit}' air-headers.txt)
                if [ -z "${major:-}" ] || [ -z "${minor:-}" ]; then
                  echo "$lib: no AIR target in its header" >&2
                  exit 1
                fi
                if [ "$major" -gt 14 ] || { [ "$major" -eq 14 ] && [ "$minor" -gt 0 ]; }; then
                  echo "$lib targets macOS $major.$minor — above the 14.0 precompiled-library floor" >&2
                  exit 1
                fi
                # the same representative function the runtime guard probes:
                # a library without it would be skipped at load anyway, but a
                # flag regression must fail the release, not ship a fallback
                grep -Eq 'Name: kernel_get_rows_bf16( |$)' air-symbols.txt || {
                  echo "$lib has no bf16 kernels — the runtime would fall back to the embedded compile" >&2
                  exit 1
                }
                echo "$lib: $n functions incl. bf16, targets macOS $major.$minor (library floor 14.0, app floor 13.3)"
                ;;
            esac
          done
          # The device load check is the stronger test, but a runner without a
          # Metal device (possible on macos-15-intel) must not fail on that
          # alone: the structural checks above stand in for it then.
          cat > metal-load.swift <<'EOF'
          import Metal
          import Foundation
          guard let device = MTLCreateSystemDefaultDevice() else {
              print("no Metal device on this runner")
              exit(3)
          }
          var bad = false
          for path in CommandLine.arguments.dropFirst() {
              do {
                  let lib = try device.makeLibrary(URL: URL(fileURLWithPath: path))
                  if lib.functionNames.isEmpty {
                      FileHandle.standardError.write("FAIL \(path): no functions\n".data(using: .utf8)!)
                      bad = true
                  } else {
                      print("loaded \(URL(fileURLWithPath: path).lastPathComponent): \(lib.functionNames.count) functions")
                  }
              } catch {
                  FileHandle.standardError.write("FAIL \(path): \(error)\n".data(using: .utf8)!)
                  bad = true
              }
          }
          exit(bad ? 1 : 0)
          EOF
          swiftc -o metal-load metal-load.swift
          rc=0
          ./metal-load "${metallibs[@]}" || rc=$?
          case $rc in
            0) ;;
            3) echo "no Metal device on this runner — load check skipped, the AIR-target and function-count checks above stand in" ;;
            *) exit "$rc" ;;
          esac
          # into files, not `| head`: under pipefail an early-exiting reader can
          # SIGPIPE the writer and fail a step that worked
          bin/ox-say > usage.txt 2>&1 || true
          grep 'ox-say serve' usage.txt >/dev/null
          engine/tts-server --help > tts-help.txt 2>&1 || true
          grep 'qwentts.cpp' tts-help.txt >/dev/null
          engine/ox-llm --help > llm-help.txt 2>&1 || true
          grep -e '--api-key-file' llm-help.txt >/dev/null
          # ox-diar, the packaged binary, against its CLI contract on a real clip: exit codes, offline, the refusal on
          # macOS older than 15 (OX_DIAR_ASSUME_MACOS lowers the version the binary sees; no runner has macOS 14) and
          # the 4 voices of the AMI excerpt, on the arm64 package only. The build tree goes first: the
          # packed binary must not lean on anything it was built beside (SwiftPM's FluidAudio_FluidAudio.bundle).
          rm -rf "$GITHUB_WORKSPACE/build"
          if [ "$ARCH" = arm64 ]; then
            afconvert -f WAVE -d LEI16@16000 -c 1 "$GITHUB_WORKSPACE/engine/diar/testdata/ami-es2004a-780-180s.flac" "$RUNNER_TEMP/diar-clip.wav"
            python3 "$GITHUB_WORKSPACE/engine/diar/test_cli.py" --bin engine/ox-diar --models "$RUNNER_TEMP/diar-models/diar" \
                --clip "$RUNNER_TEMP/diar-clip.wav" --speakers 4
          fi
          # the dictation app: signed, ours, carrying this version
          codesign --verify --strict app/OxSayDictation.app
          test "$(plutil -extract CFBundleIdentifier raw -o - app/OxSayDictation.app/Contents/Info.plist)" = io.github.anatolykoptev.ox-say.dictation
          test "$(plutil -extract CFBundleShortVersionString raw -o - app/OxSayDictation.app/Contents/Info.plist)" = "$(sed 's/^v//; s/[-+].*//' VERSION | grep -E '^[0-9]+[.][0-9]+[.][0-9]+$' || echo 0.0.0)"
          test -x scripts/install-app.sh
          (cd ../../dist && shasum -a 256 -c SHA256SUMS)

      - name: Keep the package as a workflow artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ox-say-macos-${{ matrix.arch }}
          path: dist/

  # Signs the dictation app with the Developer ID, notarizes it and repacks the
  # package. Only for a release or a manual run, and only in the "release"
  # environment, which holds the certificate and admits main alone: pull
  # requests, whose build scripts are the PR's own, never see the key.
  sign:
    name: Sign and notarize the ${{ matrix.arch }} app
    needs: [release-please, macos-package]
    # a manual run from another branch skips it: the environment admits main only
    if: "!cancelled() && needs.macos-package.result == 'success' && (needs.release-please.outputs.release_created == 'true' || (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'))"
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            runner: macos-15-intel
          - arch: arm64
            runner: macos-15
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    environment: release
    permissions:
      contents: read
    env:
      SIGN_IDENTITY: "Developer ID Application: Anatoly Koptev (Z25C7QACUF)"
      VERSION: ${{ needs.release-please.outputs.tag_name || format('dev-{0}', github.sha) }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false

      # Build the tag's commit, which must be on the history of the commit this
      # run was started for (main, which the environment admitted). Usually the
      # two are the same; a release cut in a later push's run tags the earlier
      # release merge, and a tag pointing anywhere off main is refused.
      - name: Check out the release tag
        if: needs.release-please.outputs.tag_name != ''
        env:
          TAG: ${{ needs.release-please.outputs.tag_name }}
        run: |
          set -euo pipefail
          git fetch --no-tags origin "+refs/tags/$TAG:refs/tags/$TAG"
          # on the main line of this run's commit and the release commit itself (says why when not)
          commit=$(scripts/check-release-tag.sh "$TAG" "$GITHUB_SHA")
          git checkout --detach "$commit"

      # Build the app here, from first-party Swift with no dependencies, before
      # any secret is in reach: the key signs this build, not the one the
      # package job made next to third-party engine code.
      - name: Build the app
        run: app/dictation/build.sh

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: ox-say-macos-${{ matrix.arch }}
          path: dist

      - name: Import the certificate into a temporary keychain
        env:
          MACOS_CERT_P12: ${{ secrets.MACOS_CERT_P12 }}
          MACOS_CERT_PASSWORD: ${{ secrets.MACOS_CERT_PASSWORD }}
        run: |
          set -euo pipefail
          umask 077
          SIGN_KEYCHAIN="$RUNNER_TEMP/signing.keychain-db"
          echo "SIGN_KEYCHAIN=$SIGN_KEYCHAIN" >> "$GITHUB_ENV"
          p12="$RUNNER_TEMP/cert.p12"
          trap 'rm -f "$p12"' EXIT
          kcpass=$(openssl rand -hex 24)
          security create-keychain -p "$kcpass" "$SIGN_KEYCHAIN"
          security set-keychain-settings -lut 3600 "$SIGN_KEYCHAIN"
          security unlock-keychain -p "$kcpass" "$SIGN_KEYCHAIN"
          printf '%s' "$MACOS_CERT_P12" | base64 --decode > "$p12"
          # -x: the private key cannot be exported from the keychain again.
          # -P is the only way `security import` takes the passphrase (man security: no stdin, file or env
          # form; without it, a GUI prompt a CI runner cannot answer), so it sits on argv. The exposure is
          # confined to this step on an ephemeral runner, visible only to processes of this job; the value
          # is a masked secret in the log.
          security import "$p12" -k "$SIGN_KEYCHAIN" -P "$MACOS_CERT_PASSWORD" -x -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$kcpass" "$SIGN_KEYCHAIN" > /dev/null
          # codesign looks the identity up in the search list: put ours first,
          # keep the rest (each listed as "<path>", one per line)
          keychains=()
          while IFS= read -r kc; do
            kc=${kc#*\"}
            keychains+=("${kc%\"}")
          done < <(security list-keychains -d user)
          security list-keychains -d user -s "$SIGN_KEYCHAIN" ${keychains[@]+"${keychains[@]}"}
          # a gate, not a print: exits 0 even with no valid identity
          security find-identity -v -p codesigning "$SIGN_KEYCHAIN" | grep -F "\"$SIGN_IDENTITY\"" > /dev/null

      - name: Sign, notarize and repack
        env:
          # An App Store Connect API key, which can only reach App Store
          # Connect; no Apple ID fallback, so re-adding one cannot bring the
          # broader credential back. ASC_KEY_P8 is the .p8 file, base64-encoded.
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
          NOTARY_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          NOTARY_ISSUER: ${{ secrets.ASC_ISSUER_ID }}
        run: |
          set -euo pipefail
          if [ -z "$ASC_KEY_P8" ] || [ -z "$NOTARY_KEY_ID" ] || [ -z "$NOTARY_ISSUER" ]; then
            echo "the release environment lacks the App Store Connect key (ASC_KEY_P8, ASC_KEY_ID, ASC_ISSUER_ID)" >&2
            exit 1
          fi
          umask 077
          export NOTARY_KEY="$RUNNER_TEMP/notary.p8"
          trap 'rm -f "$NOTARY_KEY"' EXIT
          printf '%s' "$ASC_KEY_P8" | base64 --decode > "$NOTARY_KEY"
          scripts/sign-release.sh dist build/dictation/OxSayDictation.app

      - name: Remove the temporary keychain
        if: always()
        run: |
          kc="$RUNNER_TEMP/signing.keychain-db"
          if [ -e "$kc" ]; then
            security delete-keychain "$kc"
          fi

      - name: Keep the signed package as a workflow artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ox-say-macos-${{ matrix.arch }}-signed
          path: dist/
          # publish takes it within this run; a manual run's signed build
          # should not linger as a public download
          retention-days: 3

  # The only job with write access: it runs no build scripts, just attaches the
  # signed package to the draft release release-please created, then publishes
  # it — drafts are excluded from releases/latest, so a failed build or a failed
  # notarization leaves the previous release as latest.
  publish:
    name: Attach the package to the release
    needs: [release-please, sign]
    if: needs.release-please.outputs.release_created == 'true'
    runs-on: ubuntu-24.04-arm
    permissions:
      contents: write
    steps:
      # No merge-multiple: each leg lands in its own directory, so one leg's
      # SHA256SUMS cannot overwrite the other's.
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: ox-say-macos-*-signed
          path: signed

      # Each architecture's job wrote a SHA256SUMS for its own asset: verify
      # each, then publish one file listing both (get.sh picks its line by the
      # asset name).
      - name: Verify and combine the checksums
        run: |
          set -euo pipefail
          mkdir dist
          for arch in x86_64 arm64; do
            dir="signed/ox-say-macos-$arch-signed"
            (cd "$dir" && shasum -a 256 -c SHA256SUMS)
            cp "$dir/ox-say-macos-$arch.tar.gz" dist/
          done
          (cd dist && shasum -a 256 ox-say-macos-x86_64.tar.gz ox-say-macos-arm64.tar.gz > SHA256SUMS)
          cat dist/SHA256SUMS

      - name: Upload to the release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          tag_name: ${{ needs.release-please.outputs.tag_name }}
          files: |
            dist/ox-say-macos-x86_64.tar.gz
            dist/ox-say-macos-arm64.tar.gz
            dist/SHA256SUMS

      - name: Publish the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # no checkout in this job, so gh has no git remote to find the repo from
          GH_REPO: ${{ github.repository }}
          TAG: ${{ needs.release-please.outputs.tag_name }}
        run: gh release edit "$TAG" --draft=false
