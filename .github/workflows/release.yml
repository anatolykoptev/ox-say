# release-please: conventional commits on main -> release PR -> tag + GitHub Release.
# The macOS package is built in this SAME workflow: a tag created with
# GITHUB_TOKEN cannot trigger a separate tag-triggered workflow (the Actions
# recursion guard). workflow_dispatch builds the package without releasing it,
# as a workflow artifact, to check the build before cutting a release.
#
# Releases are created as DRAFTS (release-please-config "draft": true +
# "force-tag-creation": true) and published only after the package is attached,
# so `releases/latest` never points at an asset-less release while the build
# runs — or forever after one that fails.

name: Release

on:
  push:
    branches: [main]
  # A PR that touches the engines or the packaging builds the package too, so a
  # broken release build shows up before the release PR does. No paths: filter —
  # the hand list kept missing inputs (scripts/fetch-models.sh, launchd/**,
  # cmd/**, internal/**, go.mod, LICENSE, NOTICE, README.md).
  pull_request:
  workflow_dispatch: {}

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Default: least privilege. Grant only what each job needs.
permissions: {}

jobs:
  release-please:
    name: Release PR / tag
    if: github.event_name == 'push'
    runs-on: ubuntu-24.04-arm
    permissions:
      contents: write
      pull-requests: write
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      - name: Run release-please
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        id: release
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  # ox-say targets Intel Macs: native x86_64 build on GitHub's Intel macOS runner
  # (free for public repos). The runner has no usable GPU, so this job only builds
  # and checks the package; the Metal path is verified by running get.sh on a
  # real Intel Mac before a release is announced.
  macos-package:
    name: Build the macOS x86_64 package
    needs: release-please
    if: "!cancelled() && (github.event_name != 'push' || needs.release-please.outputs.release_created == 'true')"
    runs-on: macos-15-intel
    timeout-minutes: 120
    # read only: this job runs the build scripts, including a PR's own
    permissions:
      contents: read
    env:
      VERSION: ${{ needs.release-please.outputs.tag_name || format('dev-{0}', github.sha) }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ needs.release-please.outputs.tag_name || github.sha }}

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      # The installer's own tests need macOS (plutil); they are quick, so they
      # run before the long engine build.
      - name: Installer tests
        run: bash scripts/test-lib-install.sh

      - name: Build tools
        run: command -v cmake >/dev/null || brew install cmake

      - name: Package
        run: scripts/package-release.sh "$VERSION"

      - name: Check the package
        run: |
          set -euo pipefail
          mkdir -p check
          tar -xzf dist/ox-say-macos-x86_64.tar.gz -C check
          cd check/ox-say
          test "$(cat VERSION)" = "$VERSION"
          for bin in bin/ox-say engine/tts-server engine/ox-stt engine/ox-align; do
            file "$bin" | grep 'x86_64' >/dev/null
            if otool -L "$bin" | grep '@rpath' >/dev/null; then
              echo "$bin links @rpath libraries" >&2
              exit 1
            fi
          done
          # into files, not `| head`: under pipefail an early-exiting reader can
          # SIGPIPE the writer and fail a step that worked
          bin/ox-say > usage.txt 2>&1 || true
          grep 'ox-say serve' usage.txt >/dev/null
          engine/tts-server --help > tts-help.txt 2>&1 || true
          grep 'qwentts.cpp' tts-help.txt >/dev/null
          # the dictation app: signed, ours, carrying this version
          codesign --verify --strict app/OxSayDictation.app
          test "$(plutil -extract CFBundleIdentifier raw -o - app/OxSayDictation.app/Contents/Info.plist)" = io.github.anatolykoptev.ox-say.dictation
          test "$(plutil -extract CFBundleShortVersionString raw -o - app/OxSayDictation.app/Contents/Info.plist)" = "$(sed 's/^v//; s/[-+].*//' VERSION | grep -E '^[0-9]+[.][0-9]+[.][0-9]+$' || echo 0.0.0)"
          test -x scripts/install-app.sh
          (cd ../../dist && shasum -a 256 -c SHA256SUMS)

      - name: Keep the package as a workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: ox-say-macos-x86_64
          path: dist/

  # Signs the dictation app with the Developer ID, notarizes it and repacks the
  # package. Only for a release or a manual run, and only in the "release"
  # environment, which holds the certificate and admits main alone: pull
  # requests, whose build scripts are the PR's own, never see the key.
  sign:
    name: Sign and notarize the app
    needs: [release-please, macos-package]
    if: "!cancelled() && needs.macos-package.result == 'success' && (needs.release-please.outputs.release_created == 'true' || github.event_name == 'workflow_dispatch')"
    runs-on: macos-15-intel
    timeout-minutes: 60
    environment: release
    permissions:
      contents: read
    env:
      SIGN_IDENTITY: "Developer ID Application: Anatoly Koptev (Z25C7QACUF)"
      APPLE_TEAM_ID: Z25C7QACUF
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ needs.release-please.outputs.tag_name || github.sha }}

      - uses: actions/download-artifact@v4
        with:
          name: ox-say-macos-x86_64
          path: dist

      - name: Import the certificate into a temporary keychain
        env:
          MACOS_CERT_P12: ${{ secrets.MACOS_CERT_P12 }}
          MACOS_CERT_PASSWORD: ${{ secrets.MACOS_CERT_PASSWORD }}
        run: |
          set -euo pipefail
          SIGN_KEYCHAIN="$RUNNER_TEMP/signing.keychain-db"
          echo "SIGN_KEYCHAIN=$SIGN_KEYCHAIN" >> "$GITHUB_ENV"
          kcpass=$(openssl rand -hex 24)
          security create-keychain -p "$kcpass" "$SIGN_KEYCHAIN"
          security set-keychain-settings -lut 3600 "$SIGN_KEYCHAIN"
          security unlock-keychain -p "$kcpass" "$SIGN_KEYCHAIN"
          printf '%s' "$MACOS_CERT_P12" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security import "$RUNNER_TEMP/cert.p12" -k "$SIGN_KEYCHAIN" -P "$MACOS_CERT_PASSWORD" -T /usr/bin/codesign
          rm -f "$RUNNER_TEMP/cert.p12"
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$kcpass" "$SIGN_KEYCHAIN" > /dev/null
          # codesign looks the identity up in the search list: put ours first,
          # keep the rest (each listed as "<path>", one per line)
          keychains=()
          while IFS= read -r kc; do
            kc=${kc#*\"}
            keychains+=("${kc%\"}")
          done < <(security list-keychains -d user)
          security list-keychains -d user -s "$SIGN_KEYCHAIN" "${keychains[@]}"
          security find-identity -v -p codesigning "$SIGN_KEYCHAIN"

      - name: Sign, notarize and repack
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
        run: scripts/sign-release.sh dist

      - name: Remove the temporary keychain
        if: always()
        run: security delete-keychain "$RUNNER_TEMP/signing.keychain-db" 2>/dev/null || true

      - name: Keep the signed package as a workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: ox-say-macos-x86_64-signed
          path: dist/

  # The only job with write access: it runs no build scripts, just attaches the
  # signed package to the draft release release-please created, then publishes
  # it — drafts are excluded from releases/latest, so a failed build or a failed
  # notarization leaves the previous release as latest.
  publish:
    name: Attach the package to the release
    needs: [release-please, sign]
    if: needs.release-please.outputs.release_created == 'true'
    runs-on: ubuntu-24.04-arm
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: ox-say-macos-x86_64-signed
          path: dist

      - name: Verify the checksum again
        run: cd dist && shasum -a 256 -c SHA256SUMS

      - name: Upload to the release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          tag_name: ${{ needs.release-please.outputs.tag_name }}
          files: |
            dist/ox-say-macos-x86_64.tar.gz
            dist/SHA256SUMS

      - name: Publish the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # no checkout in this job, so gh has no git remote to find the repo from
          GH_REPO: ${{ github.repository }}
          TAG: ${{ needs.release-please.outputs.tag_name }}
        run: gh release edit "$TAG" --draft=false
