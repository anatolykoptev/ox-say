name: ci

# Pre-merge gate. Public repo → free GitHub-hosted ARM runner (arm64 also
# matches the deploy target profile). Gate per job: gofmt, vet, race tests.

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  GOWORK: "off"

jobs:
  gate:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          # The newest 1.26.x, not the exact `go 1.26.0` floor in go.mod: setup-go v5.6.0 reads only the `go` line
          # (it ignores a `toolchain` line), and a release binary must carry the latest stdlib security patches.
          go-version: '1.26'
          check-latest: true

      # ffmpeg is required by tests: voice normalization and the mp3/opus
      # transcode path shell out to it.
      - name: Install ffmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: gofmt
        run: test -z "$(gofmt -l .)"

      # The product ships to macOS on both architectures — the linux gate must
      # still compile and vet the darwin build-tagged files (afplay player,
      # proc listing) for each.
      - name: darwin build + vet
        run: |
          for arch in amd64 arm64; do
            GOOS=darwin GOARCH=$arch go build ./...
            GOOS=darwin GOARCH=$arch go vet ./...
          done

      - name: go vet
        run: go vet ./...

      - name: go test -race
        run: go test -race -count=1 ./...

      # segmenter.h is pure C++17 (no whisper/ggml deps): compile and run its
      # standalone test directly, no CMake needed.
      - name: segmenter test
        run: c++ -std=c++17 -O1 -Wall -Wextra -Werror -o "$RUNNER_TEMP/segmenter-test" engine/stt/segmenter_test.cpp && "$RUNNER_TEMP/segmenter-test"

      # edge_pad.h (ox-stt's edge context, #123) is pure C++17 too. The model test
      # (scripts/test-stt-edges.sh) needs the Parakeet model, which CI does not have.
      - name: edge pad test
        run: c++ -std=c++17 -O1 -Wall -Wextra -Werror -o "$RUNNER_TEMP/edge-pad-test" engine/stt/edge_pad_test.cpp && "$RUNNER_TEMP/edge-pad-test"

      # redecode.h (the finish re-decode decision, #88) is pure C++17 too; the
      # decode it gates needs the model, so only the decision is tested here.
      - name: redecode test
        run: c++ -std=c++17 -O1 -Wall -Wextra -Werror -o "$RUNNER_TEMP/redecode-test" engine/stt/redecode_test.cpp && "$RUNNER_TEMP/redecode-test"

      # wav_reader.h (the one WAV reader behind ox-stt and ox-align, #13) is pure C++17 too; its test
      # also diffs it against the pre-move ox-stt reader on a mangled-WAV corpus.
      - name: wav reader test
        run: c++ -std=c++17 -O1 -Wall -Wextra -Werror -o "$RUNNER_TEMP/wav-reader-test" engine/common/wav_reader_test.cpp && "$RUNNER_TEMP/wav-reader-test"

      # sign-release.sh's stapler staple/validate retry helper, against a fake
      # xcrun; needs only bash.
      - name: notary helper test
        run: bash scripts/test-lib-notary.sh

      # swiftpm-resolve.sh's bounded retry, against a fake swift; needs only bash.
      - name: swiftpm resolve helper test
        run: bash scripts/test-swiftpm-resolve.sh

      # engine/lib-check.sh (build guards) against fake lipo/otool, and the
      # release-tag check on throwaway git repos; need bash, git and jq.
      - name: engine check and release tag tests
        run: |
          bash scripts/test-engine-checks.sh
          bash scripts/test-check-release-tag.sh

  # The dictation app is Swift and AppKit, so it needs a macOS runner — one
  # per architecture ox-say ships for. The build step also assembles and
  # ad-hoc signs the .app, which catches a broken bundle, not just broken code.
  dictation:
    strategy:
      fail-fast: false
      matrix:
        runner: [macos-15-intel, macos-15]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      # A third-party download hiccup must not fail the gate: resolve with a bounded retry before building, and
      # keep the shared SwiftPM cache across runs so a warm run needs no download at all (PR #505's diar and
      # package jobs died on one third-party zip). The cache holds only public package downloads, no credentials.
      - name: Swift toolchain fingerprint
        id: swift-toolchain
        run: swift --version | shasum -a 256 | awk '{print "fingerprint=" $1}' >> "$GITHUB_OUTPUT"

      - name: Cache SwiftPM downloads
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/Library/Caches/org.swift.swiftpm
          key: swiftpm-${{ runner.os }}-${{ runner.arch }}-${{ steps.swift-toolchain.outputs.fingerprint }}-${{ hashFiles('app/dictation/Package.swift', 'app/dictation/Package.resolved') }}
          restore-keys: |
            swiftpm-${{ runner.os }}-${{ runner.arch }}-${{ steps.swift-toolchain.outputs.fingerprint }}-
            swiftpm-${{ runner.os }}-${{ runner.arch }}-

      - name: Resolve Swift packages
        run: scripts/swiftpm-resolve.sh app/dictation

      - name: swift test
        run: swift test --package-path app/dictation

      - name: build the app bundle
        run: app/dictation/build.sh

      - name: bundle shape matches the signing allowlist
        run: bash scripts/test-bundle-shape.sh

      - name: install-app tests
        run: bash app/dictation/test-install-app.sh

      # sign-release.sh's entitlements check, on real plists (needs plutil).
      - name: entitlements check test
        run: bash scripts/test-entitlements.sh

      # The arm64 baseline guard (issue #109): its probe cases need only Xcode
      # clang; the real-binary cases print SKIP on CI.
      - name: arm64 baseline guard test
        if: runner.arch == 'ARM64'
        run: bash scripts/check-arm64-baseline_test.sh

  # The installer shell scripts (lib-install, fetch-models, get.sh) have their own tests; before this job they ran only
  # in release.yml, so a PR that broke fetch-models.sh stayed green until a release. They need macOS (plutil, shasum,
  # get.sh refuses elsewhere), python3 (the stall test's local listener) and Go (test-lib-install builds ox-say).
  # Quick: about 2 minutes of test time on an arm64 runner, one runner, no matrix.
  installers:
    runs-on: macos-15
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: go.mod

      - name: installer tests
        run: |
          bash scripts/test-lib-install.sh
          bash scripts/test-fetch-models.sh
          bash scripts/test-download-stall.sh

  # ox-diar (speaker diarization, engine/diar): a Swift package on FluidAudio's Core ML models, Apple Silicon only.
  # The Intel leg of plan Task 20a (macos-15-intel, .cpuOnly) failed on its first run: Core ML cannot run the models
  # there ("Unable to compute the prediction using ML Program", run 40100359856), so the Intel package carries no
  # ox-diar (release.yml asserts that) and the daemon reports cpu_unsupported. Xcode 26 because the manifest asks for
  # Swift tools 6.2.
  diar:
    strategy:
      fail-fast: false
      matrix:
        runner: [macos-15]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.3.app/Contents/Developer
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      # FluidAudio and its binary targets come down from third-party release URLs inside `swift test`/`swift
      # build` — one hiccup there must not fail the gate (PR #505's diar job died on one zip). Resolve first,
      # with a bounded retry, and keep the shared SwiftPM cache plus the extracted artifacts across runs; both
      # hold only public package downloads, no credentials.
      - name: Swift toolchain fingerprint
        id: swift-toolchain
        run: swift --version | shasum -a 256 | awk '{print "fingerprint=" $1}' >> "$GITHUB_OUTPUT"

      - name: Cache SwiftPM downloads
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/Library/Caches/org.swift.swiftpm
            engine/diar/.build/artifacts
          key: swiftpm-${{ runner.os }}-${{ runner.arch }}-${{ steps.swift-toolchain.outputs.fingerprint }}-${{ hashFiles('engine/diar/Package.swift', 'engine/diar/Package.resolved') }}
          restore-keys: |
            swiftpm-${{ runner.os }}-${{ runner.arch }}-${{ steps.swift-toolchain.outputs.fingerprint }}-
            swiftpm-${{ runner.os }}-${{ runner.arch }}-

      # --force-resolved-versions: the same flag swift test and engine/diar/build.sh use.
      - name: Resolve Swift packages
        run: scripts/swiftpm-resolve.sh engine/diar --force-resolved-versions

      - name: swift test
        # --force-resolved-versions: swift test must not rewrite Package.resolved before build.sh takes its copy to compare.
        run: swift test --package-path engine/diar --force-resolved-versions

      - name: build ox-diar
        run: engine/diar/build.sh "$RUNNER_TEMP/diar-work" "$RUNNER_TEMP/diar-out"

      - name: Cache the diarization models
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/diar-models
          key: diar-models-${{ hashFiles('scripts/fetch-models.sh') }}
          restore-keys: diar-models-

      - name: Diarization models
        run: bash scripts/fetch-models.sh --diar-only "$RUNNER_TEMP/diar-models"

      # The default engine (Nemotron), forced to the CPU: the runner's Neural Engine is not guaranteed to compile a Core
      # ML graph, so OX_DIAR_COMPUTE_UNITS lowers what the loader asks for (a seam that can only make the choice more
      # conservative). The CLI contract, the offline rule, the refusal on macOS older than 15 (OX_DIAR_ASSUME_MACOS
      # lowers the version the binary sees) and the four voices of the AMI excerpt. The ANE and GPU facts are NOT
      # proven here; they are proven on a real Mac (engine/diar/probe_gpu.sh, scripts/probe-diar-dictation.sh).
      # The binary is copied away and the build tree removed first: it must not lean on anything it was built beside
      # (SwiftPM's FluidAudio_FluidAudio.bundle).
      - name: ox-diar smoke
        env:
          OX_DIAR_COMPUTE_UNITS: cpuOnly
        run: |
          mkdir "$RUNNER_TEMP/diar-run"
          cp "$RUNNER_TEMP/diar-out/ox-diar" "$RUNNER_TEMP/diar-run/"
          rm -rf "$RUNNER_TEMP/diar-work" "$RUNNER_TEMP/diar-out"
          afconvert -f WAVE -d LEI16@16000 -c 1 engine/diar/testdata/ami-es2004a-780-180s.flac "$RUNNER_TEMP/diar-clip.wav"
          python3 engine/diar/test_cli.py --bin "$RUNNER_TEMP/diar-run/ox-diar" --models "$RUNNER_TEMP/diar-models/diar" \
              --clip "$RUNNER_TEMP/diar-clip.wav" --speakers 4

      # The pyannote engine (OX_SAY_DIAR_ENGINE=pyannote, deleted with the engine later): one contract step, same binary.
      - name: ox-diar smoke (pyannote contract)
        run: |
          python3 engine/diar/test_cli.py --bin "$RUNNER_TEMP/diar-run/ox-diar" --models "$RUNNER_TEMP/diar-models/diar" \
              --clip "$RUNNER_TEMP/diar-clip.wav" --speakers 4 --engine pyannote

  # ox-clean (voice cleanup, engine/clean): a Swift package around a Core ML mask model, built for BOTH architectures
  # (plan decision 8; ox-diar is Apple Silicon only). Xcode 26 because the manifest asks for Swift tools 6.2; the path
  # below is on the macos-15 (arm64) and macos-15-intel runner images (runner-images macos-15 readmes, checked
  # 2026-11-04).
  # No hosted VM runs the real model: on macos-15 the first CI run (run 41886943007) printed nothing for 36 minutes in
  # `swift test --filter ModelGoldenTests` until the job timeout, so Core ML on the VM's paravirtual GPU hangs or is
  # unusably slow, and cpuOnly is not an option on arm64 (the CPU fp16 defect: the known-answer check refuses it). The
  # Intel VM cannot run Core ML either (the ox-diar Intel leg failed there, run 40100359856). Both arches therefore
  # run the stub suite, the build and the model-free half of the CLI contract; the real model is gated on a physical
  # Mac by engine/clean/release_check.sh before a release. Every Swift step has its own timeout, so a hang costs
  # minutes, not the job.
  clean:
    strategy:
      fail-fast: false
      matrix:
        runner: [macos-15, macos-15-intel]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.3.app/Contents/Developer
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      # Same download-hiccup invariant as the other Swift jobs: resolve first with a bounded retry and keep the
      # shared SwiftPM cache across runs. The cache holds only public package downloads, no credentials.
      - name: Swift toolchain fingerprint
        id: swift-toolchain
        run: swift --version | shasum -a 256 | awk '{print "fingerprint=" $1}' >> "$GITHUB_OUTPUT"

      - name: Cache SwiftPM downloads
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/Library/Caches/org.swift.swiftpm
          key: swiftpm-${{ runner.os }}-${{ runner.arch }}-${{ steps.swift-toolchain.outputs.fingerprint }}-${{ hashFiles('engine/clean/Package.swift', 'engine/clean/Package.resolved') }}
          restore-keys: |
            swiftpm-${{ runner.os }}-${{ runner.arch }}-${{ steps.swift-toolchain.outputs.fingerprint }}-
            swiftpm-${{ runner.os }}-${{ runner.arch }}-

      # --force-resolved-versions: the same flag swift test and engine/clean's suite use.
      - name: Resolve Swift packages
        run: scripts/swiftpm-resolve.sh engine/clean --force-resolved-versions

      # The suite that needs no weights (the real-model tests skip without OX_CLEAN_MODELS). A debug build, so the
      # timing bounds (release-only, `#if !DEBUG`) are asserted by the next step.
      - name: swift test
        timeout-minutes: 15
        run: swift test --package-path engine/clean --force-resolved-versions

      # The 20 s window must stay a small fraction of the model call (#462, #472). Those two tests assert their bound
      # only in a release build, which `swift test` is not by default; `-enable-testing` keeps @testable working. The
      # Intel VM is left out: its bound has not been measured on a runner.
      - name: timing tests (release)
        if: runner.arch == 'ARM64'
        timeout-minutes: 15
        run: |
          swift test -c release -Xswiftc -enable-testing --package-path engine/clean --force-resolved-versions \
              --filter 'FbankTests/testTwentySecondWindowIsFast|SpectrumTests/testTwentySecondWindowTime'

      - name: build ox-clean
        timeout-minutes: 15
        run: engine/clean/build.sh "$RUNNER_TEMP/clean-work" "$RUNNER_TEMP/clean-out"

      # The model-free half of the CLI contract (usage, version, the OS gate, the input and output refusals, a missing
      # models folder): everything that ends before a model is loaded.
      - name: ox-clean CLI contract (no model)
        timeout-minutes: 5
        run: python3 engine/clean/test_cli.py --bin "$RUNNER_TEMP/clean-out/ox-clean" --no-models

      # Evidence for later, never a gate: what Metal devices the hosted arm64 VM exposes.
      - name: Metal devices (diagnostic)
        if: runner.arch == 'ARM64'
        continue-on-error: true
        timeout-minutes: 2
        run: system_profiler SPDisplaysDataType | head -30
